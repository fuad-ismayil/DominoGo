[package]
name = "uno-client"
version = "0.1.0"
edition = "2021"
description = "UnoGo Rust browser interface"

[dependencies]
uno-core = { path = "../uno-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Node", "NodeList", "Element", "HtmlElement", "HtmlInputElement", "DomRect", "DomTokenList", "CssStyleDeclaration", "MediaQueryList", "Navigator", "Location", "History", "Storage", "UrlSearchParams", "Request", "RequestInit", "Response", "Headers", "AbortController", "AbortSignal", "Clipboard", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "OscillatorNode", "OscillatorType", "GainNode"] }
