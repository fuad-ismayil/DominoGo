[package]
name = "domino-server"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "DominoGo authoritative server — axum + socketioxide + rusqlite port of server.ts"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dependencies]
domino-core = { path = "../domino-core" }
uno-core = { path = "../../../unogo/crates/uno-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
socketioxide = { version = "0.18", features = ["extensions"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rusqlite = { version = "0.34", features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
